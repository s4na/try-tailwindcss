<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>（テスト）アンケートフォーム</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">アンケートにご協力ください</h1>

        <form action="#" method="POST">
            <!-- お名前 -->
            <div class="mb-4">
                <label for="name" class="block text-gray-700 text-sm font-bold mb-2">お名前 <span class="text-red-500">*</span></label>
                <input type="text" id="name" name="name" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- メールアドレス -->
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">メールアドレス <span class="text-red-500">*</span></label>
                <input type="email" id="email" name="email" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 年齢層 -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">年齢層</label>
                <div class="flex items-center space-x-4">
                    <label class="inline-flex items-center">
                        <input type="radio" name="age" value="10s" class="form-radio h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">10代</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="age" value="20s" class="form-radio h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">20代</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="age" value="30s" class="form-radio h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">30代</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="age" value="40s_plus" class="form-radio h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">40代以上</span>
                    </label>
                </div>
            </div>

            <!-- 興味のある分野 -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">興味のある分野（複数選択可）</label>
                <div class="space-y-2">
                    <label class="flex items-center">
                        <input type="checkbox" name="interests[]" value="technology" class="form-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">テクノロジー</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" name="interests[]" value="sports" class="form-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">スポーツ</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" name="interests[]" value="music" class="form-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">音楽</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" name="interests[]" value="travel" class="form-checkbox h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">旅行</span>
                    </label>
                </div>
            </div>

            <!-- 満足度 -->
            <div class="mb-4">
                <label for="satisfaction" class="block text-gray-700 text-sm font-bold mb-2">満足度</label>
                <select id="satisfaction" name="satisfaction"
                        class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500">
                    <option value="">選択してください</option>
                    <option value="very_satisfied">非常に満足</option>
                    <option value="satisfied">満足</option>
                    <option value="neutral">普通</option>
                    <option value="dissatisfied">不満</option>
                    <option value="very_dissatisfied">非常に不満</option>
                </select>
            </div>

            <!-- ご意見・ご感想 -->
            <div class="mb-6">
                <label for="comments" class="block text-gray-700 text-sm font-bold mb-2">ご意見・ご感想</label>
                <textarea id="comments" name="comments" rows="4"
                          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- 送信ボタン -->
            <div class="flex items-center justify-center">
                <button type="submit"
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                    送信する
                </button>
            </div>
        </form>
    </div>

</body>
</html>
